name: CI - Monitoring Stack

on:
  push:
    branches: [ "main", "develop", "migracion" ]
  pull_request:
    branches: [ "main", "develop", "migracion" ]

jobs:

  build-and-test:
    name: Build + Test + Audit
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Docker
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker
        run: docker version

      # ------------------------------------------
      # Create .env (NECESARIO antes de compose)
      # ------------------------------------------
      - name: Create .env files from templates
        run: |
          cp ops/services/postgres/.env.template ops/services/postgres/.env
          cp ops/services/smtp_relay/.env.template ops/services/smtp_relay/.env || true
          cp ops/stacks/observability/.env.template ops/stacks/observability/.env || true

      # ------------------------------------------
      # Secrets for SMTP (CI)
      # ------------------------------------------
      - name: Create SMTP secrets (CI)
        run: |
          mkdir -p ops/services/smtp_relay/secrets
          echo "ci_user@test.com" > ops/services/smtp_relay/secrets/smtp_user
          echo "ci_pass" > ops/services/smtp_relay/secrets/smtp_pass

      - name: Test init_config modes (relay/auth)
        run: |
          export PYTHONPATH=src
          python3 - <<'PY'
          import os, sys, shutil
          from monitoring.common import config

          # Ensure env-based relay mode works
          os.environ.pop('SMTP_USER', None)
          os.environ.pop('SMTP_PASS', None)
          os.environ['SMTP_MODE'] = 'relay'
          config.init_config(secrets_required=None)
          print('OK: relay mode')

          # Simulate missing secrets for auth mode: move files temporarily
          os.environ['SMTP_MODE'] = 'auth'
          shutil.move('ops/services/smtp_relay/secrets/smtp_user','ops/services/smtp_relay/secrets/smtp_user.bak')
          shutil.move('ops/services/smtp_relay/secrets/smtp_pass','ops/services/smtp_relay/secrets/smtp_pass.bak')
          try:
            try:
              config.init_config()
              print('ERROR: auth mode did not fail as expected')
              sys.exit(1)
            except Exception as e:
              print('OK: auth mode missing secrets failed as expected:', e)
          finally:
            shutil.move('ops/services/smtp_relay/secrets/smtp_user.bak','ops/services/smtp_relay/secrets/smtp_user')
            shutil.move('ops/services/smtp_relay/secrets/smtp_pass.bak','ops/services/smtp_relay/secrets/smtp_pass')
          PY

      # ------------------------------------------
      # Lint docker-compose
      # ------------------------------------------
      - name: Validate docker-compose files
        run: |
          docker compose -f ops/stacks/cron/compose.yml config > /dev/null
          docker compose -f ops/stacks/python/compose.yml config > /dev/null
          docker compose -f ops/stacks/observability/compose.yml config > /dev/null
          docker compose -f ops/services/postgres/compose.yml config > /dev/null
          docker compose -f ops/services/smtp_relay/compose.yml config > /dev/null

      # ------------------------------------------
      # Check :latest forbidden
      # ------------------------------------------
      - name: Check forbidden :latest tag (compose only)
        run: |
          FILES=$(find ops -name "compose*.yml" -o -name "compose*.yaml")

          for f in $FILES; do
            if grep -E "image:.*:latest" "$f"; then
              echo "❌ Uso de :latest en $f"
              exit 1
            fi
          done

          echo "✔ No se usa :latest en compose"

      # ------------------------------------------
      # Build containers
      # ------------------------------------------
      - name: Build containers
        run: |
          docker compose -f ops/stacks/python/compose.yml build --no-cache
          docker compose -f ops/stacks/cron/compose.yml build --no-cache
      # ------------------------------------------
      # Network
      # ------------------------------------------
      - name: Create monitoring networks
        run: |
          docker network create backend-net || true
          docker network create observability-net || true
          docker network create restricted-net || true

      # ------------------------------------------
      # Start stack
      # ------------------------------------------
      - name: Start stack
        run: |
          docker compose -f ops/stacks/observability/compose.yml up -d
          docker compose -f ops/stacks/python/compose.yml up -d --force-recreate --build
          docker compose -f ops/stacks/cron/compose.yml up -d --force-recreate --build
          docker compose -f ops/services/postgres/compose.yml up -d
          docker compose -f ops/services/smtp_relay/compose.yml up -d

      # ------------------------------------------
      # Debug user python
      # ------------------------------------------
      - name: Debug user
        run: docker exec monitoring-python id

      # ------------------------------------------
      # Wait for PostgreSQL (dependency readiness)
      # ------------------------------------------
      - name: Wait for PostgreSQL ready
        run: |
          timeout 60 sh -c '
          until docker exec monitoring-postgres pg_isready; do
            echo "Esperando PostgreSQL..."
            sleep 2
          done
          '

      # ------------------------------------------
      # Wait for containers stabilization
      # ------------------------------------------
      - name: Wait for containers
        run: sleep 10

      # ------------------------------------------
      # Network connectivity test (robusto)
      # ------------------------------------------
      - name: Test network (debug container)
        run: |
          echo "=== TEST NETWORK (CI) ==="

          docker run --rm --network observability-net nicolaka/netshoot sh -c "
            echo '→ DNS loki'
            nslookup loki

            echo '→ HTTP loki'
            curl -f http://loki:3100/ready
          "

          docker run --rm --network backend-net nicolaka/netshoot sh -c "
            echo '→ TCP postgres'
            nc -zv monitoring-postgres 5432
          "

          echo "✔ Network test OK"

      - name: Test service connectivity
        run: |
          echo "=== TEST CONNECTIVITY ==="

          # TCP test to Postgres in backend-net
          docker run --rm --network backend-net nicolaka/netshoot sh -c "
            echo '→ testing postgres';
            nc -zv monitoring-postgres 5432;
          "

          # Loki / Grafana tests in observability-net
          docker run --rm --network observability-net nicolaka/netshoot sh -c "
            echo '→ testing loki';
            curl -f http://loki:3100/ready;

            echo '→ testing grafana';
            curl -f http://grafana:3001;
          "

          # Test desde host (Loki expuesto en 127.0.0.1)
          curl -f http://localhost:3100/ready || (echo "❌ Loki no accesible desde host" && exit 1)

          echo "✔ Conectividad OK"

      # ------------------------------------------
      # SECURITY CHECKS
      # ------------------------------------------
      - name: Check exposed ports
        run: |
          docker ps --format "{{.Names}} {{.Ports}}"
          if docker ps --format "{{.Ports}}" | grep -E "0.0.0.0"; then
            echo "❌ Puertos expuestos incorrectamente"
            exit 1
          else
            echo "✔ Puertos correctamente restringidos"
          fi

      - name: Check docker.sock usage
        run: |
          if grep -R "docker.sock" ops; then
            echo "⚠ docker.sock detectado (ver ADR-0008)"
          else
            echo "✔ docker.sock no usado"
          fi

      # ------------------------------------------
      # TESTS
      # ------------------------------------------
      - name: Test network
        run: make test-network

      - name: Test security runtime (ADR-0018)
        run: make test-security-runtime

      - name: Test resilience
        run: make test-resilience-completo

      - name: Test observability
        run: make test-observability-core

#      - name: Test cron
#        run: make test-cron-execution

      - name: Test python health
        run: make test-python-health

      - name: Test SMTP (CI safe)
        run: make test-smtp-ci

      # ------------------------------------------
      # SMTP unit + integration tests
      # ------------------------------------------
      - name: Test SMTP unit/integration
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest
          make test-smtp-unitarios-integration

      # ------------------------------------------
      # Compose policy tests
      # ------------------------------------------
      - name: Test compose security policies
        run: |
          python3 -m pip install pyyaml pytest
          export PYTHONPATH=src
          pytest tests/unit/test_compose_policy.py -q

      # ------------------------------------------
      # SECURITY RUNTIME (ADR-0018)
      # ------------------------------------------
      - name: Test security runtime
        run: make test-security-runtime

      # ------------------------------------------
      # Logs on failure
      # ------------------------------------------
      - name: Dump logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs grafana || true
          docker logs loki || true
          docker logs monitoring-python || true
          docker logs monitoring-cron || true
          docker logs monitoring-postgres || true
          docker logs monitoring-smtp-relay || true

      # ------------------------------------------
      # Cleanup
      # ------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker compose -f ops/stacks/observability/compose.yml down -v || true
          docker compose -f ops/stacks/python/compose.yml down -v || true
          docker compose -f ops/stacks/cron/compose.yml down -v || true
          docker compose -f ops/services/postgres/compose.yml down -v || true
          docker compose -f ops/services/smtp_relay/compose.yml down -v || true
          docker network rm backend-net || true
          docker network rm observability-net || true
          docker network rm restricted-net || true
