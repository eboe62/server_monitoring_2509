networks:
  ia-net:
    driver: bridge

services:
  # PIEZA 1: El Proxy (Sidecar)
  ia_proxy:
    build:
      context: .
      dockerfile: Dockerfile.ia_proxy
    image: ia-proxy:latest
    pull_policy: build
    container_name: ia_proxy
    networks:
      - ia-net
    environment:
      - ANTHROPIC_API_KEY
    ports:
      - "8000:8000"
    restart: unless-stopped

  # PIEZA 2: La jaula de Claude Code
  ia_claude_runtime:
    build:
      context: .
      dockerfile: Dockerfile.claude
    image: ia-claude:latest
    pull_policy: build
    container_name: ia_claude_runtime
    networks:
      - ia-net
    depends_on:
      - ia_proxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    environment:
      - ANTHROPIC_BASE_URL=http://ia_proxy:8000
      - CI=true
      - CLAUDE_CODE_DISABLE_ANALYTICS=true
      - CLAUDE_CODE_AUTO_COMPACT_WINDOW=190000
    volumes:
      - ${PWD}:/workspace
      - ~/.gitconfig:/home/eboe62/.gitconfig:ro
    stdin_open: true
    tty: true
    command: /home/eboe62/.npm-global/bin/claude
