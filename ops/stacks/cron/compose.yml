services:
  monitoring-cron:
    build:
      context: ../../..
      dockerfile: ops/stacks/cron/Dockerfile
    image: monitoring-cron:v1.0.0
    container_name: monitoring-cron
    restart: unless-stopped

    env_file:
      - ../../services/postgres/.env

    environment:
      POSTGRES_HOST: monitoring-postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}

    volumes:
      # Montamos el cronfile en la ruta que espera supercronic
      # Acceso en solo lectura a los logs crudos de Docker (JSON por contenedor)
      # ⚠️ Necesario para que log_honeypot_geolocation.py pueda leer los accesos del honeypot nginx.
      # Se monta en modo "ro" (read-only) por motivos de seguridad.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Proyecto completo (scripts Python y utilidades)
      - ../../../:/opt/monitoring

      # Logs del host para que los scripts puedan escribir ahí
      - /var/log:/var/log

      # Acceso al socket de Docker para los scripts de docker_resources.sh y .py)
      # - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD-SHELL", "pidof supercronic || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      monitoring-postgres:
        condition: service_healthy
      loki:
        condition: service_started

    networks:
      - monitoring-net  # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

networks:
  monitoring-net:
    external: true
