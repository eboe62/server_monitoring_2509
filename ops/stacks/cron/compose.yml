services:
  monitoring-cron:
    build:
      context: ../../..
      dockerfile: ops/stacks/cron/Dockerfile

    image: monitoring-cron:v1.0.0
    container_name: monitoring-cron
    restart: always

    env_file:
      - ../../services/postgres/.env

    volumes:
      # Acceso en solo lectura a los logs crudos de Docker (JSON por contenedor)
      # ⚠️ Necesario para que log_honeypot_geolocation.py pueda leer los accesos del honeypot nginx.
      # Se monta en modo "ro" (read-only) por motivos de seguridad.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Proyecto completo (scripts Python y utilidades)
      - ../../../:/opt/monitoring

      # Logs del host para que los scripts puedan escribir ahí
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Acceso al socket de Docker para los scripts de docker_resources.sh y .py - SE INHABILITA POR SEGURIDAD EN LOS MICRO-STACKS
      # - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD-SHELL", "pidof supercronic || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - monitoring-net  # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

networks:
  monitoring-net:
    external: true
