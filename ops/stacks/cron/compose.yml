services:
  monitoring-cron:
    build:
      context: ../../..
      dockerfile: ops/stacks/cron/Dockerfile

    image: monitoring-cron:v1.0.0
    container_name: monitoring-cron
    restart: always

    # Configuración en dos ficheros no versionados:
    # - postgres/.env: conexión a la BBDD (host, puerto, nombre, usuario). Sin contraseña.
    # - ./.env: correo (relay, remitente, destinatarios) e IPINFO_TOKEN. Plantilla: ./.env.template
    env_file:
      - ../../services/postgres/.env
      - ./.env

    volumes:
      # Línea A (B2): lectura directa de los logs del host (auth, kern, fail2ban).
      # Solo lectura: excepción aprobada en ops/audit/check_hostconfig.sh (ALLOWED_READONLY).
      # Es la misma fuente que lee Promtail (Línea B), pero cada línea la lee por su cuenta.
      - /var/log:/var/log:ro

      # Contraseña de PostgreSQL como fichero (no como variable): POSTGRES_PASSWORD_FILE.
      # En el host el fichero debe ser legible por el grupo 10001 (appuser): chgrp 10001 + chmod 640.
      - ../../services/postgres/secrets/postgres_password:/run/secrets/postgres_password:ro

      # Backups de PostgreSQL (pg_dump por TCP desde este contenedor).
      - monitoring-backups:/backups:rw

      # Recursos de los contenedores (B5b): contadores del kernel (cgroup v2) en solo lectura.
      # Solo system.slice, nunca /sys/fs/cgroup completo. Excepción auditada: ADR-0031 §2.
      - /sys/fs/cgroup/system.slice:/host/cgroup:ro
      # Traducción id -> nombre que escribe el host al final de make deploy (containers.map)
      - ./runtime:/host/runtime:ro

      # ❌ ELIMINADO (B2) → honeypot desactivado hasta que la Línea A funcione
      # - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # ❌ ELIMINADO → rompe reproducibilidad
      # - ../../../:/opt/monitoring

      # Acceso al socket de Docker para los scripts de docker_resources.sh y .py - SE INHABILITA POR SEGURIDAD EN LOS MICRO-STACKS
      # - /var/run/docker.sock:/var/run/docker.sock

    # Grupo adm (gid 4) del host: propietario de lectura de /var/log/auth.log, kern.log, fail2ban.log (640)
    group_add:
      - "4"

    healthcheck:
      test: ["CMD-SHELL", "pidof supercronic || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Límites de recursos (ADR-0016 P2): declarados en Compose
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    networks:
      - backend-net     # BBDD
      - restricted-net  # smtp-relay (envío de alertas)
    environment:
      SMTP_MODE: relay
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Los scripts de ingesta solo leen /var/log si se activa explícitamente
      ALLOW_HOST_LOGS: "true"
    # Hardening incremental: security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend-net:
    external: true
  restricted-net:
    external: true

volumes:
  # Nombre explícito: un único volumen de backups, independiente del nombre del proyecto Compose
  # (antes existían cron_postgres-backups y postgres_postgres-backups, ambos vacíos).
  monitoring-backups:
    name: monitoring-backups
