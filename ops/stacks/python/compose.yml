services:
  monitoring-python:
    build:
      context: ../../..
      dockerfile: ops/stacks/python/Dockerfile
    image: monitoring-python:v1.0.0
    container_name: monitoring-python
    restart: unless-stopped

    env_file:
      - ../../services/postgres/.env

    environment:
      POSTGRES_HOST: monitoring-postgres

    volumes:
      # Monta el proyecto para ejecutar scripts Python
      - ../../../:/opt/monitoring

      # Logs del host para que los scripts puedan escribir ahí
      - /var/log:/var/log

      # Acceso al socket de Docker (para docker_resources.sh y .py)
      # - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os, psycopg2; psycopg2.connect(host=os.getenv(\"POSTGRES_HOST\"), user=os.getenv(\"POSTGRES_USER\"), password=os.getenv(\"POSTGRES_PASSWORD\"), dbname=os.getenv(\"POSTGRES_NAME\"))' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - monitoring-net  # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

networks:
  monitoring-net:
    external: true
