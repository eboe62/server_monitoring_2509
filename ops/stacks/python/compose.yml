services:
monitoring-base:
  monitoring-python:
    build:
      context: ../../../
      dockerfile: ops/stacks/python/Dockerfile

    image: monitoring-python:v1.0.0
    container_name: monitoring-python
    restart: always

    env_file:
      - ../../services/postgres/.env

    volumes:
      # Monta el proyecto para ejecutar scripts Python
      - ../../../:/opt/monitoring

      # Logs del host para que los scripts puedan escribir ahí
      - /var/log:/var/log

      # Acceso al socket de Docker para los scripts de docker_resources.sh y .py - SE INHABILITA POR SEGURIDAD EN LOS MICRO-STACKS
      # - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: [
        "CMD-SHELL",
        "python3 -c 'import os, psycopg2; psycopg2.connect(host=os.getenv(\"POSTGRES_HOST\"), port=os.getenv(\"POSTGRES_PORT\"), user=os.getenv(\"POSTGRES_USER\"), password=os.getenv(\"POSTGRES_PASSWORD\"), dbname=os.getenv(\"POSTGRES_NAME\"))' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - monitoring-net  # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

networks:
  monitoring-net:
    external: true
