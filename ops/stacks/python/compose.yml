services:
  monitoring-python:
    build:
      context: ../../../
      dockerfile: ops/stacks/python/Dockerfile

    image: monitoring-python:v1.0.0
    container_name: monitoring-python
    restart: always

    env_file:
      - ../../services/postgres/.env

    # Sin montajes del host (B10-6: se quitó /var/lib/docker/containers, que no usaba nadie)

    healthcheck:
      test: ["CMD", "python3", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    # Límites de recursos (ADR-0016 P2): declarados en Compose
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

    networks:
      - backend-net  # Red backend (DB + aplicaciones autorizadas)
      - observability-net # Acceso a la red de observabilidad (Loki)
      - restricted-net # Red restringida para servicios específicos (sin acceso a Docker ni logs host)
    environment:
      SMTP_MODE: relay
    # Hardening incremental: security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend-net:
    external: true

  observability-net:
    external: true

  restricted-net:
    external: true
