server:
  http_listen_port: 9080  # Puerto donde Promtail escucha las solicitudes HTTP
  grpc_listen_port: 0     # GRPC deshabilitado para simplificar la configuración

clients:
  # Loki por la red interna de Docker (observability-net)
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /var/lib/promtail/promtail-positions.yml  # Archivo para rastrear las posiciones de lectura de logs

scrape_configs:
# AUTH LOGS (host): solo los ficheros de seguridad: auth.log, ufw.log y fail2ban.log (B9-1b).
# kern.log, cloud-init y droplet-agent quedan fuera: arranques del kernel y ruido. Los bloqueos
# del cortafuegos llegan de ufw.log; los OOM los vigila la Línea A (cgroups).
# Requiere el grupo adm en el contenedor (group_add "4" en el compose): son 640 :adm.
# Es el único trabajo (B10-6): los logs de los contenedores (container_logs y honeypot) eran el 97 %
# de lo que entraba en Loki y nada los usaba; se ven con docker logs.
# Única etiqueta añadida: reason (pocos valores fijos). IP, usuario y puerto NO son etiquetas:
# cada valor distinto crearía un flujo nuevo en Loki; se extraen al consultar (| regexp).
  - job_name: auth_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth_logs
          service_name: system
          __path__: /var/log/{auth,ufw,fail2ban}.log   # sin los rotados (.log.1, .gz)

    pipeline_stages:
      # Ruido sin valor de seguridad: sesiones de cron/sudo y systemd-logind/polkitd (arranques,
      # apagados y cierres de sesión; la entrada ya cuenta como "SSH aceptado"). En fail2ban,
      # "Found" repite cada fallo de SSH y "Unban" el fin de cada ban ya contado (B9-2).
      - drop:
          expression: "(pam_unix\\(.*?:session\\): session (opened|closed)|CRON|Session \\d+|New session \\d+|banner exchange|Server listening|systemd-logind|polkitd|fail2ban\\.filter .*\\] Found |fail2ban\\.actions .*\\] Unban )"

      # Clasificación: cada match fija reason; el último que coincide manda (orden de menos a más concreto)
      - match:
          selector: '{job="auth_logs"} |~ "Received disconnect|Connection (closed|reset) by [0-9a-f:.]+ port"'
          stages:
            - template: {source: reason, template: "SSH desconexión"}
      - match:
          selector: '{job="auth_logs"} |~ "authenticating user|Failed (password|publickey)|error: maximum"'
          stages:
            - template: {source: reason, template: "SSH autenticación fallida"}
      - match:
          selector: '{job="auth_logs"} |~ "[Ii]nvalid user"'
          stages:
            - template: {source: reason, template: "SSH usuario inválido"}
      - match:
          selector: '{job="auth_logs"} |~ "Unable to negotiate|not in PubkeyAcceptedAlgorithms|kex_protocol_error|kex_exchange_identification"'
          stages:
            - template: {source: reason, template: "SSH negociación fallida"}
      - match:
          selector: '{job="auth_logs"} |~ "Accepted (publickey|password)"'
          stages:
            - template: {source: reason, template: "SSH aceptado"}
      - match:
          selector: '{job="auth_logs"} |~ "sudo(\\[\\d+\\])?: .*COMMAND="'
          stages:
            - template: {source: reason, template: "sudo"}
      - match:
          selector: '{job="auth_logs", filename="/var/log/fail2ban.log"} |= " Ban "'
          stages:
            - template: {source: reason, template: "fail2ban ban"}
      - match:
          selector: '{job="auth_logs", filename="/var/log/ufw.log"} |= "[UFW BLOCK]"'
          stages:
            - template: {source: reason, template: "Bloqueo UFW"}

      # Sin clasificar: "Otros"
      - template:
          source: reason
          template: '{{ if .Value }}{{ .Value }}{{ else }}Otros{{ end }}'
      - labels:
          reason:

