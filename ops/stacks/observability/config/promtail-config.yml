server:
  http_listen_port: 9080  # Puerto donde Promtail escucha las solicitudes HTTP
  grpc_listen_port: 0     # GRPC deshabilitado para simplificar la configuración

clients:
#  No se debe usar IP pública dentro del cluster Docker.
#  - url: http://165.22.87.56:3100/loki/api/v1/push  # URL del endpoint de Loki donde se enviarán los logs
#  En su lugar utilizar endpoint Loki interno vía Docker: http://loki:3100/loki/api/v1/push
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /var/lib/promtail/promtail-positions.yml  # Archivo para rastrear las posiciones de lectura de logs

scrape_configs:
#   Logs de autenticación del sistema

# AUTH LOGS (host): todos los /var/log/*.log (auth, kern, ufw, fail2ban, ...)
# Requiere el grupo adm en el contenedor (group_add "4" en el compose): son 640 :adm.
# Única etiqueta añadida: reason (pocos valores fijos). IP, usuario y puerto NO son etiquetas:
# cada valor distinto crearía un flujo nuevo en Loki; se extraen al consultar (| regexp).
  - job_name: auth_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth_logs
          service_name: system
          __path__: /var/log/*.log   # sin los rotados (.log.1, .gz)

    pipeline_stages:
      # Ruido sin valor de seguridad
      - drop:
          expression: "(pam_unix\\(.*?:session\\): session (opened|closed)|CRON|Session \\d+|New session \\d+|banner exchange|Server listening)"

      # Líneas de UFW repetidas en kern.log: se cuentan solo desde ufw.log
      - match:
          selector: '{job="auth_logs", filename="/var/log/kern.log"} |= "[UFW "'
          action: drop

      # Clasificación: cada match fija reason; el último que coincide manda
      - match:
          selector: '{job="auth_logs"} |~ "Accepted (publickey|password)"'
          stages:
            - template: {source: reason, template: "SSH aceptado"}
      - match:
          selector: '{job="auth_logs"} |~ "Connection closed by authenticating user|Failed (password|publickey)"'
          stages:
            - template: {source: reason, template: "SSH autenticación fallida"}
      - match:
          selector: '{job="auth_logs"} |~ "[Ii]nvalid user"'
          stages:
            - template: {source: reason, template: "SSH usuario inválido"}
      - match:
          selector: '{job="auth_logs"} |~ "Received disconnect|Disconnecting authenticating|error: maximum"'
          stages:
            - template: {source: reason, template: "SSH desconexión"}
      - match:
          selector: '{job="auth_logs"} |= "Unable to negotiate"'
          stages:
            - template: {source: reason, template: "SSH negociación fallida"}
      - match:
          selector: '{job="auth_logs"} |= "Removed session"'
          stages:
            - template: {source: reason, template: "Sesión cerrada"}
      - match:
          selector: '{job="auth_logs", filename="/var/log/fail2ban.log"} |= " Ban "'
          stages:
            - template: {source: reason, template: "fail2ban ban"}
      - match:
          selector: '{job="auth_logs", filename="/var/log/kern.log"} |= "INPUT DROP"'
          stages:
            - template: {source: reason, template: "Bloqueo iptables"}
      - match:
          selector: '{job="auth_logs", filename="/var/log/ufw.log"} |= "[UFW BLOCK]"'
          stages:
            - template: {source: reason, template: "Bloqueo UFW"}

      # Sin clasificar: "Otros"
      - template:
          source: reason
          template: '{{ if .Value }}{{ .Value }}{{ else }}Otros{{ end }}'
      - labels:
          reason:

# DOCKER LOGS (TODOS EXCEPTO HONEYPOT)
  - job_name: container_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: container_logs
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time

      - timestamp:
          source: time
          format: RFC3339Nano

      - output:
          source: log

      - labels:
          stream:

# HONEYPOT (SOLO ESTE CONTENEDOR)
# Logs del honeypot nginx (CapRover)
  - job_name: honeypot # Nombre descriptivo del trabajo
    static_configs:
      - targets:
          - localhost # Dirección del servidor donde se leen los logs
        labels:
          job: honeypot # Etiqueta común para los logs
          service_name: nginx
          honeypot: "true"
          __path__: /var/lib/docker/containers/*/*.log # Patrón para incluir logs específicos
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{container_name=~".*honeypot.*"}'
          stages:
            - json:
                expressions:
                  log: log
            - regex:
                expression: 'client: (?P<client_ip>[0-9.]+)'
            - labels:
                client_ip:
                container_name:
