---
# Configuración de Loki (B9-1). La usa el contenedor por el 'command:' del compose: sin él,
# la imagen arranca con su /etc/loki/local-config.yaml y este fichero se ignora.
# Datos en /loki: el volumen loki-data se monta ahí y hereda el dueño 'loki' (uid 10001) de la imagen.
auth_enabled: false  # Autenticación deshabilitada

server:
  http_listen_port: 3100  # Puerto HTTP

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory         # Almacenamiento en memoria
      replication_factor: 1
  # B10-4: con 1m/30m cada flujo (reason) cerraba un chunk casi cada minuto: 24.699 ficheros de
  # ~12,6 KB de media en PRO (22/11) frente a los 512 KB objetivo. Con el WAL no se pierden líneas.
  # max_chunk_age < query_ingesters_within (3h por defecto): lo aún en memoria se sigue consultando.
  chunk_idle_period: 30m        # Tiempo inactivo antes de cerrar un chunk
  max_chunk_age: 2h             # Edad máxima de un chunk
  chunk_target_size: 512000     # Tamaño objetivo de los chunks
  chunk_retain_period: 30s      # Periodo de retención de chunks cerrados
  wal:
    enabled: true
    dir: /loki/wal  # Directorio para Write Ahead Log (WAL)

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

limits_config:
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 72h   # al arrancar, Promtail no reenvía líneas de más de 3 días
  retention_period: 192h            # 8 días: el resumen semanal ve la semana completa (B9)
  # Trozos de 24 h al consultar (por defecto 30 min): 7 días eran 336 trozos por panel, la cola se
  # llenaba ("too many outstanding requests") y con 0,5 CPU tardaba ~25 s (B9-2c)
  split_queries_by_interval: 24h
  # Series por consulta (por defecto 500): el top 5 de puertos y de IPs cuenta antes cada valor
  # distinto, y en 7 días los escáneres prueban más de 500 puertos (B9-2e)
  max_query_series: 20000
#  max_streams_per_user: 50
#  max_samples_per_stream: 1000

# Cola de consultas: el panel lanza varias a la vez (por defecto 100 pendientes por usuario) (B9-2c)
query_scheduler:
  max_outstanding_requests_per_tenant: 2048

frontend:
  max_outstanding_per_tenant: 2048

# La retención la aplica el compactor (borra índice y chunks). table_manager solo borraba
# tablas de índice, no los chunks del disco.
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
