services:

# ------------------------------------------
# PROMTAIL
# ------------------------------------------

  promtail:
    image: grafana/promtail:2.9.3
    container_name: ${PROMTAIL_CONTAINER_NAME}

    volumes:
      - /var/log:/var/log:rw  # Permitir escritura para actualizar promtail-positions.yml
      - ./config/promtail-config.yml:/etc/promtail/promtail-config.yml:ro  # Configuración de Promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

    command: -config.file=/etc/promtail/promtail-config.yml

    restart: always

    deploy:
      resources:
        limits:
          memory: 250M
          cpus: "0.25"
#    ports:
#      Sin exposición de puertos (solo red interna monitoring-net)
#      - "${PROMTAIL_PORT}:9080"  # Exposición opcional de métricas Promtail
    networks:
      - monitoring-net  # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

# ------------------------------------------
# LOKI
# ------------------------------------------

  loki:
    image: grafana/loki:2.9.3
    container_name: ${LOKI_CONTAINER_NAME}

    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro  # Configuración de Loki
#      - ./data/loki:/var/lib/loki  # Persistencia de datos para Loki
      - loki-data:/var/lib/loki  # Persistencia de datos para Loki con logs indexados
    ports:
#      Sin exposición de puertos (solo red interna monitoring-net)
      - "127.0.0.1:${LOKI_PORT}:3100"  # API de Loki accesible desde el host
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.5"

    networks:
      - monitoring-net # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

# ------------------------------------------
# GRAFANA
# ------------------------------------------

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ${GRAFANA_CONTAINER_NAME}
#    network_mode: host  # importante para acceso a localhost:2526 y 127.0.0.1 pero innecesario si accedemos por red Docker
    volumes:
      - grafana-data:/var/lib/grafana  # Persistencia de dashboards y configuración interna
      - ./config/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro # Provisionamiento automático de datasources
# Grafana expuesto en 3001 para evitar conflictos con CapRover  (3000)
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3001"

    environment:

      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}

      - GF_SERVER_HTTP_PORT=3001
#      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT} # Indica a Grafana cuál es la URL pública
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}

      - GF_SERVER_SERVE_FROM_SUB_PATH=true  # Permite servir desde un subpath

      # Configuración SMTP → envía alertas a través de smtp-relay
      - GF_SMTP_ENABLED=true
#      - GF_SMTP_HOST=127.0.0.1:2526  # Al tener network_mode: "host" estamos compartiendo red con el host y ya podemos usar 127.0.0.1
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME}

      # Sistema de alertas habilitado
      - GF_ALERTING_ENABLED=true
      - GF_ALERTING_EXECUTE_ALERTS=true

      # Configuración de autenticación/seguridad
#      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
#      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE}
#      - GF_LOG_LEVEL=${GF_LOG_LEVEL}
    restart: always

    depends_on:
      loki:
        condition: service_healthy

    healthcheck:
    test:
      [
        "CMD-SHELL",
        "wget -qO- http://localhost:3001/api/health 2>/dev/null | grep -q 'ok' || exit 1"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.3"

    networks:
      - monitoring-net # Red compartida (Grafana, Loki, Postgres, SMTP relay...)

volumes:
  loki-data:
    driver: local

  grafana-data:
    driver: local

# ------------------------------------------
# NETWORKS
# ------------------------------------------

networks:
  monitoring-net:
    external: true
